<!doctype html>
<html lang="ru">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

      content="Портфолио Никиты Сеитова — художника, исследующего взаимодействие человека и реального мира."

  <body>
    <main id="site" class="site" data-page="home">
      <a class="home-art" href="#home" aria-label="На главную">

        <video
          class="home-video"
          src="assets/home-video.mp4?v=12"

            <a
              href="https://t.me/eachuisg4"
              target="_blank"

          <a class="project-link" href="?project=panc-1#project" aria-label="PANC-1">

          </a>
          <a class="project-link" href="?project=asmr-kuking#project" aria-label="ASMR KUKING">
            <img class="project-mechanism" src="assets/projects-mechanism-hq.png" alt="Механизм с жёлтым элементом и чёрной деталью">

          <a class="project-link" href="?project=foole#project" aria-label="foole">

          <a class="project-link" href="?project=paralysis-of-choice#project" aria-label="Паралич выбора">
            <img class="project-sculpture" src="assets/projects-sculpture-hq.png" alt="Белая скульптура на чёрном постаменте">

          <a class="project-link" href="?project=loop#project" aria-label="Петля">
            <img class="project-projection" src="assets/projects-projection-hq.png" alt="Видеопроекция в затемнённом выставочном зале">
          </a>

          <div class="project-detail-copy">

          <div class="project-detail-gallery" data-detail-gallery></div>
